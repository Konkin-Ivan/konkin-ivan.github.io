{{ define "main" }}
<article class="post" data-post-id="{{ .File.UniqueID }}">
    <header> 
        {{ partial "breadcrumbs.html" . }}
        <time>{{ .Date.Format "2006.01.02" }}</time>
        <div class="post-tags">
          {{ range .Params.tags }}
          <a href="{{ "/tags/" | relLangURL }}{{ . | urlize }}" class="tag">#{{ . }}</a>
          {{ end }}
        </div>
    </header>
    
    <div class="content"> 
        
        <!-- TOC -->
        {{ if .TableOfContents }}
        <nav class="table-of-contents">
            <h2>📑 Содержание</h2>
            {{ .TableOfContents }}
        </nav>
        {{ end }}
        <script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('pre').forEach(function(pre) {
        const button = document.createElement('button');
        button.textContent = '📋';
        button.className = 'copy-btn';
        button.onclick = function() {
            navigator.clipboard.writeText(pre.textContent);
            button.textContent = '✅';
            setTimeout(() => button.textContent = '📋', 2000);
        };
        pre.style.position = 'relative';
        button.style.position = 'absolute';
        button.style.top = '10px';
        button.style.right = '10px';
        pre.appendChild(button);
    });
});
</script>
        {{ .Content }}
        
        <div class="post-stats">
            <span class="views">👁‍🗨 0</span>
            <span class="likes">💛 0</span>
        </div>
    </div>
</article>

<style>
.table-of-contents {
    background: var(--post-card);
    padding: 1.5rem;
    border-radius: 8px;
    margin: 2rem 0;
    border-left: 4px solid var(--accent);
}

.table-of-contents h2 {
    margin-top: 0;
    margin-bottom: 1rem;
    font-size: 1.2em;
    color: #f8f8f2;
}

.table-of-contents ul {
    list-style: none;
    padding-left: 0;
    margin: 0;
}

.table-of-contents li {
    margin: 0.5rem 0;
    line-height: 1.4;
}

.table-of-contents a {
    text-decoration: none;
    color: var(--meta);
    transition: color 0.2s ease;
    display: block;
    padding: 0.2rem 0;
}

.table-of-contents a:hover {
    color: #ff79c6;
}

.table-of-contents ul ul {
    padding-left: 1rem;
    margin: 0.25rem 0;
    border-left: 1px solid var(--meta);
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Копирование кода
    document.querySelectorAll('pre').forEach(function(pre) {
        const button = document.createElement('button');
        button.textContent = '📋';
        button.className = 'copy-btn';
        button.onclick = function() {
            const code = pre.querySelector('code') ? pre.querySelector('code').textContent : pre.textContent;
            navigator.clipboard.writeText(code);
            button.textContent = '✅';
            setTimeout(() => button.textContent = '📋', 2000);
        };
        pre.style.position = 'relative';
        button.style.position = 'absolute';
        button.style.top = '10px';
        button.style.right = '10px';
        button.style.background = '#333';
        button.style.border = 'none';
        button.style.padding = '5px';
        button.style.borderRadius = '3px';
        button.style.cursor = 'pointer';
        button.style.color = 'white';
        pre.appendChild(button);
    });

    // Плавная прокрутка для TOC
    document.querySelectorAll('.table-of-contents a[href^="#"]').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const targetId = this.getAttribute('href').substring(1);
            const targetElement = document.getElementById(targetId);
            if (targetElement) {
                targetElement.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        });
    });
});
</script>
{{ end }}
