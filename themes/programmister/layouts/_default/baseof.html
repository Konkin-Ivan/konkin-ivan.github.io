<!DOCTYPE html>
<html lang="ru" data-theme="dracula">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <!-- Мета-описание -->
    <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    
    <!-- Open Graph метатеги -->
    <meta property="og:title" content="{{ .Title }}">
    <meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:image" content="{{ if .Params.image }}{{ .Params.image | absURL }}{{ else }}{{ .Site.BaseURL }}images/og-image.jpg{{ end }}">
    {{ if .Params.image_alt }}<meta property="og:image:alt" content="{{ .Params.image_alt }}">{{ end }}
    <meta property="og:site_name" content="{{ .Site.Title }}">
    
    <!-- Twitter Card метатеги -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ .Title }}">
    <meta name="twitter:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta name="twitter:image" content="{{ if .Params.image }}{{ .Params.image | absURL }}{{ else }}{{ .Site.BaseURL }}images/og-image.jpg{{ end }}">
    {{ if .Params.image_alt }}<meta name="twitter:image:alt" content="{{ .Params.image_alt }}">{{ end }}

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "css/style.css" | absURL }}">
      
    <!-- Yandex.Metrika counter -->
    <script type="text/javascript">
      (function(m,e,t,r,i,k,a){
          m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
          m[i].l=1*new Date();
          for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
          k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
      })(window, document,'script','https://mc.yandex.ru/metrika/tag.js', 'ym');

      ym(94746958, 'init', {webvisor:true, clickmap:true, accurateTrackBounce:true, trackLinks:true});
    </script>
  <noscript><div><img src="https://mc.yandex.ru/watch/94746958" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
    <!-- /Yandex.Metrika counter -->
</head>
<body>
    <div class="container">
        <header>
            <nav class="nav">
                <a href="{{ .Site.BaseURL }}"><strong>{{ .Site.Title }}</strong></a>
    
                <button class="nav-toggle" aria-expanded="false" aria-label="Меню">☰</button>
                <div class="nav-links" id="navLinks">
                  <a href="{{ "about" | relURL }}">О сайте</a>
                  <a href="{{ "tags" | relURL }}">Теги</a>
                  <a href="{{ "index.xml" | relURL }}" title="RSS">📡 RSS</a>
                </div>
                <div class="theme-switcher">
                    <button class="theme-btn" onclick="setTheme('catppuccin')">☀️</button>
                    <button class="theme-btn" onclick="setTheme('dracula')">🌙</button>
                </div>
            </nav>
        </header>

        <main>
            {{ block "main" . }}{{ end }}
        </main>

        <footer>
            <p>© {{ now.Year }} {{ .Site.Title }} • Powered by Konkin</p>
        </footer>
    </div>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": "{{ .Title }}",
        "description": "{{ .Description }}",
          "author": {
          "@type": "Person",
          "name": "Иван"
        }
      }
    </script>
    <script>
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }
        
        // Восстанавливаем тему при загрузке
        const savedTheme = localStorage.getItem('theme') || 'dracula';
        setTheme(savedTheme);
    </script>
    <div id="reading-progress"></div>

    <script>
    // Прогресс-бар чтения
    const progressBar = document.getElementById('reading-progress');

    function updateProgressBar() {
      const windowHeight = window.innerHeight;
      const documentHeight = document.documentElement.scrollHeight - windowHeight;
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    
      const progress = (scrollTop / documentHeight) * 100;
      progressBar.style.width = progress + '%';
    }

    // Только на страницах постов
    if (document.querySelector('.post')) {
      progressBar.style.display = 'block';
      window.addEventListener('scroll', updateProgressBar);
      window.addEventListener('resize', updateProgressBar);
    }
    </script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="{{ "js/analytics.js" | absURL }}"></script>
    <script src="{{ "js/toogle_menu.js" | absURL }}"></script> 
</body>
</html>
